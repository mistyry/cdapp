[package]
name = "cdapp"
version = "0.1.0"
description = "非官方 KOOK 精简客户端"
authors = ["mistyry"]
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"

[lib]
name = "cdapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "query", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
flate2 = "1"
futures-util = "0.3"
log = "0.4"
tauri-plugin-log = "2"
rand = "0.10"
url = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
webrtc = { version = "0.21", default-features = false, features = ["runtime-tokio", "crypto-aws-lc-rs"] }
rtc = { version = "0.21", default-features = false, features = ["crypto-aws-lc-rs"] }
async-trait = "0.1"
bytes = "1"
cpal = "0.18"
opus = "0.4"
tauri-plugin-dialog = "2"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
sha2 = "0.10"
nnnoiseless = { version = "0.5", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "wav", "pcm"] }
tauri-plugin-prevent-default = { version = "6", features = ["platform-windows"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSBezierPath", "NSBitmapImageRep", "NSButton", "NSControl", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading"] }
windows-core = "0.62"
png = "0.18"
base64 = "0.22"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.clippy]
mod_module_files = "deny"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[features]
test-media = []

[[test]]
name = "live_voice"
required-features = ["test-media"]

[[test]]
name = "live_mic"
required-features = ["test-media"]

[[test]]
name = "live_playback"
required-features = ["test-media"]

[[test]]
name = "live_soak"
required-features = ["test-media"]

[[test]]
name = "live_denoise"
required-features = ["test-media"]

[[test]]
name = "live_voice_presence"
required-features = ["test-media"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "test-util"] }
libc = "0.2"

[[test]]
name = "live_moderation"
required-features = ["test-media"]

[[test]]
name = "live_rebuild_share"
required-features = ["test-media"]
